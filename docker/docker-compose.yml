services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auth_logic_hunter
      POSTGRES_PASSWORD: auth_logic_hunter
      POSTGRES_DB: auth_logic_hunter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_logic_hunter"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://auth_logic_hunter:auth_logic_hunter@postgres:5432/auth_logic_hunter
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
