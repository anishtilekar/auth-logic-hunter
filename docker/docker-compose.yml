name: auth-logic-hunter

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: auth_logic_hunter
      POSTGRES_PASSWORD: auth_logic_hunter
      POSTGRES_DB: auth_logic_hunter
    ports:
      # Host-side 5433, not 5432 — avoids colliding with a native/pre-existing
      # Postgres install on the host (bit us in dev: Windows had one running
      # as a service on 5432, and localhost:5432 silently connected to that
      # instead of this container). Container-internal traffic (the `backend`
      # service's DATABASE_URL below) still uses 5432 — unaffected.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_logic_hunter"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://auth_logic_hunter:auth_logic_hunter@postgres:5432/auth_logic_hunter
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
